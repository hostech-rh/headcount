const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxZa6p4kP1TUvaNHGuzr4GY1dEE3NNd8gKWltLhSfE_8zebpCfTxlF-yQaAqbg9alPM/exec';

async function syncToSheets(section, rows) {
  try {
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ section, rows }),
      mode: 'no-cors',
    });
  } catch (e) { console.warn('Sync a Sheets falló (sigue guardado local):', e); }
}

const _debounceTimers = {};
function debouncedSyncToSheets(section, rows) {
  clearTimeout(_debounceTimers[section]);
  _debounceTimers[section] = setTimeout(() => syncToSheets(section, rows), 800);
}

async function loadFromSheet() {
  state.syncLabel = 'Sincronizando…';
  render();
  try {
    const res = await fetch(APPS_SCRIPT_URL, { redirect: 'follow' });
    const data = await res.json();
    if (data && data.strategicPositions && data.strategicPositions.length) { state.strategicPositions = data.strategicPositions; lsSave(LS_KEYS.strategicPositions, state.strategicPositions); }
    if (data && data.vacancies && data.vacancies.length) { state.vacancies = data.vacancies; lsSave(LS_KEYS.vacancies, state.vacancies); }
    if (data && data.successionRows && data.successionRows.length) { state.successionRows = data.successionRows; lsSave(LS_KEYS.successionRows, state.successionRows); }
    if (data && data.growthRoles && data.growthRoles.length) { state.growthRoles = data.growthRoles; lsSave(LS_KEYS.growthRoles, state.growthRoles); }
    if (data && data.deptComments && data.deptComments.length) {
      const obj = {};
      data.deptComments.forEach((r) => { obj[r.dept] = r.comentario; });
      state.deptComments = obj;
      lsSave(LS_KEYS.deptComments, obj);
    }
    if (data && data.nextSteps && data.nextSteps.length) {
      state.nextSteps = data.nextSteps.map((r) => r.text);
      lsSave(LS_KEYS.nextSteps, state.nextSteps);
    }
    // Si el Sheet aún no tiene una sección pero ya hay algo local (o de
    // ejemplo), la subimos para que quede sembrada allá también.
    if (!(data && data.strategicPositions && data.strategicPositions.length)) syncToSheets('strategicPositions', state.strategicPositions || DEFAULT_STRATEGIC_POSITIONS);
    if (!(data && data.vacancies && data.vacancies.length)) syncToSheets('vacancies', state.vacancies || DEFAULT_VACANCIES);
    if (!(data && data.successionRows && data.successionRows.length)) syncToSheets('successionRows', state.successionRows || DEFAULT_SUCCESSION);
    if (!(data && data.growthRoles && data.growthRoles.length)) syncToSheets('growthRoles', state.growthRoles || DEFAULT_GROWTH_ROLES);
    if (!(data && data.nextSteps && data.nextSteps.length)) syncToSheets('nextSteps', (state.nextSteps || DEFAULT_NEXT_STEPS).map((text) => ({ text })));
    state.lastSync = new Date();
    state.syncLabel = 'Datos sincronizados ✓';
  } catch (err) {
    console.warn('No se pudo leer el Sheet, se usa lo guardado en este navegador:', err);
    state.syncLabel = 'Modo local (sin conexión al Sheet)';
  }
  render();
}

    const compareLabel = year === '2025' ? 'vs cierre 2024' : (year === '2026' ? 'vs cierre 2025' : 'Selecciona 2025 o 2026 para comparar');

    const areasComputed = areasRaw.map((a, i) => {
      let hc, prevHc;

    });

    const maxHc = Math.max(...areasComputed.map(a => a.hc), 1);

    const totalCost = hasCost ? areasComputed.reduce((s, a) => s + (a.cost || 0), 0) : null;
    const totalCostLabel = hasCost ? '$' + (totalCost / 1000000).toFixed(2) + 'M' : 'Pendiente';

    function fmtDelta(v) {
      if (v == null) return '—';
      if (v === 0) return '±0';

    }
    function deltaColor(v) {
      if (v == null) return '#8c8c98';
      if (v > 0) return '#4563FF';
      if (v < 0) return '#C40E91';
      return '#8c8c98';
    }

    let cum = 0;
    const areas = areasComputed.map(a => {
      const sharePct = Math.round((a.hc / totalHc) * 1000) / 10;
      const start = cum;
      cum += (a.hc / totalHc) * 100;

        name: a.name,
        hc: a.hc,

        costLabel: (hasCost && a.cost != null) ? '$' + Math.round(a.cost / 1000) + 'K' : 'Pendiente',
        costCardText: (hasCost && a.cost != null) ? ('$' + Math.round(a.cost / 1000) + 'K' + (year === '2024' ? ' (2024, eq. mensual)' : year === '2025' ? ' (2025, eq. mensual)' : ' (2026, prom. mensual)')) : 'Costo: pendiente',
        donutFrom: start,

      };
    });
    const donutGradient = 'conic-gradient(' + areas.map(a => `${a.legendColor} ${a.donutFrom}% ${a.donutTo}%`).join(', ') + ')';

    const totalHeadcountLabel = year === '2027' ? '136' : String(totalHc);

    const periodLabel = year === '2027'

        ? 'Corte ' + year + ' · ' + monthsList[monthIndex] + (monthIndex === lastMonthIdx ? (year === '2026' ? ' (actual, 17-sep)' : ' (cierre de año)') : '')

    const monthButtons = monthsList.map((label, i) => ({

    }

    const [dVentas, dReservaciones, dGruposBodas, dAdministracion, dRH, dMarketing, dTransformacion, dDesarrollo, dProducto, dContabilidad, dDireccion, dOperaciones] = areas;

    const evoRaw = [

      { year: '2026', value: 112, note: 'Corte real al 17-sep-2026', color: '#C40E91', border: 'none' },

    ];
    const maxEvo = Math.max(...evoRaw.map(e => e.value));

    const tenureBands = [

    const costoLabelByYear = {

    const kpis = [
      { label: headcountLabelByYear[year], value: String(hcHeadline), delta: hcDeltaText, deltaColor: hcPrev != null ? '#4563FF' : '#6b6b76', accent: '#4563FF' },
      { label: costoLabelByYear[year], value: costoAnualByYear[year], delta: costoDeltaByYear[year], deltaColor: '#6b6b76', accent: '#C40E91' },
      bajasForYear
        ? { label: 'Bajas ' + year + ' (ene–jul)', value: bajasForYear.vol + ' vol · ' + bajasForYear.invol + ' invol', delta: bajasForYear.total + ' bajas totales', deltaColor: '#6b6b76', accent: '#FAD83F' }

      { label: 'Antigüedad promedio', value: tenureByYear[year] != null ? (tenureByYear[year] + ' años') : 'Pendiente', delta: tenureByYear[year] != null ? ('Real · Reporte de posiciones (' + (year === '2026' ? 'hoy' : 'cierre ' + year) + ')') : 'No aplica todavía', deltaColor: '#6b6b76', accent: '#4563FF' },
      year === '2026'

    ];

    return {
      isResumen, isDepto, isFuente,
      year,
      syncLabel,
      resumenBg: isResumen ? '#111118' : 'transparent',
      resumenColor: isResumen ? '#FAD83F' : '#6b6b76',
      deptoBg: isDepto ? '#111118' : 'transparent',

      fuenteBg: isFuente ? '#111118' : 'transparent',

      isMonthlyYear,
      y2024Bg: year === '2024' ? '#111118' : 'transparent',
      y2024Color: year === '2024' ? '#FAD83F' : '#6b6b76',
      y2025Bg: year === '2025' ? '#111118' : 'transparent',

      areas, totalHeadcountLabel, totalCostLabel, costPeriodLabel, hasAreaData,

      strategicPositions, vacancies,
      deptComments: { ...DEFAULT_DEPT_COMMENTS, ...(state.deptComments || {}) },
      hasBajasData, bajasExpanded, bajasPeriodLabel, bajasSourceLabel, bajasVolCount, bajasInvolCount, bajasTotalCount,

      tabuladorRows, tabuladorCountLabel,
      bajasMonthly, bajasDetalle,
      dVentas, dReservaciones, dGruposBodas, dAdministracion, dRH, dMarketing, dTransformacion, dDesarrollo, dProducto, dContabilidad, dDireccion, dOperaciones,
      kpis, evolution, turnoverTrend, tenureBands, successionRows,
    };
}
